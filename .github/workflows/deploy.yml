name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: image-name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${OWNER}/tasketcasket:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: ${{ steps.image-name.outputs.image }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Get runner IP
        id: runner-ip
        run: echo "ipv4=$(curl -4 -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"
      - name: Allow runner SSH
        id: allow-ssh
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ vars.APP_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32"
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/*
          target: /opt/app
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_VERSION: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,DATABASE_URL,SECRET_KEY,APP_ENV,APP_VERSION,GHCR_USER,GHCR_TOKEN
          script: bash /opt/app/deploy.sh
      - name: Remove runner SSH rule
        if: always() && steps.allow-ssh.outcome == 'success'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ vars.APP_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32"
      - name: Health check
        run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.APP_URL }}/health"

  e2e-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: app
    env:
      PYTEST_BASE_URL: ${{ vars.APP_URL }}
      E2E_EXPECTED_ENV: ${{ vars.APP_ENV }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e -v
      
  deploy-production:
    needs: [build, deploy-staging, e2e-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Get runner IP
        id: runner-ip
        run: echo "ipv4=$(curl -4 -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"
      - name: Allow runner SSH
        id: allow-ssh
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ vars.APP_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32"
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/*
          target: /opt/app
          strip_components: 1
      - uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_ENV: ${{ vars.APP_ENV }}
          APP_VERSION: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE,DATABASE_URL,SECRET_KEY,APP_ENV,APP_VERSION,GHCR_USER,GHCR_TOKEN
          script: bash /opt/app/deploy.sh
      - name: Remove runner SSH rule
        if: always() && steps.allow-ssh.outcome == 'success'
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ vars.APP_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32"
      - name: Health check
        run: curl --fail --retry 10 --retry-delay 6 --retry-all-errors "${{ vars.APP_URL }}/health"
