{% extends "base.html" %}

{% block title %}New task{% endblock %}

{% block content %}
<h1>New task</h1>

{% if error %}<p class="error">{{ error }}</p>{% endif %}


  <form method="post" action="{{ url_for('tasks.new_task') }}">
    <!-- Title input -->
    <label for="title">Task title</label>
    <input 
      type="text" 
      name="title" 
      maxlength="200" 
      required placeholder="Add a task title here  e.g. 'Study for the exam'"
    >
    <label for="description">Description</label>
    <textarea 
      id="desc"
      name="description" 
      placeholder="Add a task description here (optional)"></textarea>

    <div class="btn1">
    <button type="submit">Save task</button>
    <a href="{{ url_for('tasks.index') }}">
        <button type="button"> Cancel</button>
    </a>
    </div>
    <br><br>
    
  </form>

{% endblock %}
